<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-FINDER DOS v3.0</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green:    #00ff41;
    --green-dim:#00aa28;
    --green-dk: #006616;
    --green-xdk:#003308;
    --bg:       #080808;
    --amber:    #ffaa00;
    --yellow:   #ffff00;
    --red:      #ff4444;
    --gold:     #ffd700;
    --silver:   #c0c0c0;
    --bronze:   #cd7f32;
  }

  body {
    background: #000;
    font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
    font-size: 13px;
    color: var(--green);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* CRT scanlines */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.09) 2px, rgba(0,0,0,0.09) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* CRT vignette */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center,
      rgba(0,255,65,0.02) 0%, rgba(0,0,0,0.45) 100%);
    pointer-events: none;
    z-index: 9998;
  }

  #root {
    max-width: 960px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100vh;
    background: var(--bg);
  }

  /* ── ANIMATIONS ── */
  @keyframes blink    { 50% { opacity: 0; } }
  @keyframes fadeIn   { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes typeIn   { from { width:0; } to { width:100%; } }
  @keyframes glow     { 0%,100%{text-shadow:0 0 4px var(--green);} 50%{text-shadow:0 0 12px var(--green), 0 0 24px var(--green);} }

  .blink  { animation: blink 1s step-end infinite; }
  .fadeIn { animation: fadeIn 0.25s ease-out; }
  .glow   { animation: glow 3s ease-in-out infinite; }

  /* ── VERSION BAR ── */
  #vbar {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--green-dk);
    border-bottom: 1px solid var(--green-xdk);
    padding-bottom: 6px;
    margin-bottom: 12px;
  }

  /* ── DOS BOX ── */
  .box {
    border: 1px solid var(--green);
    padding: 12px 16px;
    margin-bottom: 12px;
    position: relative;
  }
  .box-red   { border-color: var(--red); }
  .box-title {
    position: absolute;
    top: -9px; left: 12px;
    background: var(--bg);
    padding: 0 6px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--green);
  }
  .box-title-red { color: var(--red); }

  /* ── ASCII HEADER ── */
  .ascii {
    white-space: pre;
    font-size: 11px;
    line-height: 1.25;
    color: var(--green-dim);
    text-align: center;
    margin-bottom: 6px;
  }
  .subtitle {
    color: var(--green-dk);
    font-size: 11px;
    letter-spacing: 3px;
    text-align: center;
    margin-bottom: 2px;
  }

  /* ── MENU ITEMS ── */
  .menu-item {
    display: flex;
    align-items: center;
    padding: 5px 10px;
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 2px;
    transition: background 0.08s;
    user-select: none;
  }
  .menu-item:hover, .menu-item:focus {
    background: var(--green);
    color: #000;
    outline: none;
  }
  .menu-item:hover .num, .menu-item:focus .num { color: #000; }
  .num { color: var(--yellow); margin-right: 10px; min-width: 28px; }
  .icon-tag { color: var(--green-dk); margin-right: 8px; }
  .arrow { margin-left: auto; opacity: .35; }

  /* ── RANK TABLE ── */
  .rank-table { width: 100%; border-collapse: collapse; }
  .rank-table th {
    color: var(--yellow);
    border-bottom: 1px solid var(--green-dim);
    padding: 4px 8px;
    text-align: left;
    font-size: 11px;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .rank-table td {
    padding: 5px 8px;
    border-bottom: 1px solid var(--green-xdk);
    font-size: 12px;
    vertical-align: middle;
  }
  .rank-table tr:hover td { background: rgba(0,255,65,0.04); }

  .r1 { color: var(--gold); }
  .r2 { color: var(--silver); }
  .r3 { color: var(--bronze); }
  .r4 { color: var(--green-dim); }

  /* ── SCORE BAR ── */
  .score-wrap { display:inline-flex; gap:2px; align-items:center; }
  .sb { width:10px; height:10px; display:inline-block; }
  .sb-on  { background: var(--green); }
  .sb-off { background: var(--green-xdk); border:1px solid #005510; }

  /* ── BADGES ── */
  .badge {
    display: inline-block;
    border: 1px solid;
    padding: 1px 5px;
    font-size: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .b-top  { color: var(--red);   border-color: var(--red); }
  .b-free { color: var(--green); border-color: var(--green); }
  .b-paid { color: var(--amber); border-color: var(--amber); }

  /* ── BUTTONS ── */
  .dos-btn {
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
    font-family: inherit;
    font-size: 12px;
    padding: 5px 14px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background 0.08s;
    margin-top: 8px;
  }
  .dos-btn:hover { background: var(--green); color: #000; }

  /* ── PROMPT ── */
  .prompt { color: var(--green-dim); font-size: 12px; margin-top: 10px; }
  .hl { color: var(--yellow); }
  .dim { color: var(--green-dk); }

  /* ── FOOTER ── */
  #footer {
    margin-top: 16px;
    border-top: 1px solid var(--green-xdk);
    padding-top: 6px;
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #003d0e;
  }

  /* ── BOOT SCREEN ── */
  #boot {
    text-align: center;
    margin-top: 80px;
  }
  #boot-text { color: var(--green-dim); margin-top: 24px; }

  /* ── INFO ROW ── */
  .info-row { display: flex; gap: 12px; }
  .info-row .box { flex: 1; }
  .info-line { color: var(--green-dim); font-size: 11px; line-height: 1.9; }

  @media (max-width: 600px) {
    .info-row { flex-direction: column; }
    .rank-table th:nth-child(4),
    .rank-table td:nth-child(4) { display: none; }
    #vbar span:nth-child(2) { display: none; }
  }
</style>

function scoreBar(score) {
  const n = Math.round(score / 10);
  let html = '<span class="score-wrap">';
  for (let i = 0; i < 10; i++)
    html += `<span class="sb ${i < n ? 'sb-on' : 'sb-off'}"></span>`;
  html += `</span> <span style="font-size:11px;margin-left:4px">${score}</span>`;
  return html;
}

function badge(tag, price) {

  if (tag === 'none') return '';
  if (price === 'Kostenlos' || price.startsWith('Free'))
    return '<span class="badge b-free">FREE</span>';
  return '<span class="badge b-paid">PRO</span>';
}

function rankClass(r) {

        <table class="rank-table">
          <thead>
            <tr>
              <th>#</th>
              <th>TOOL</th>
              <th>SCORE</th>
              <th>BEWERTUNG</th>
              <th style="text-align:right">PREIS</th>
            </tr>
          </thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>

    ${warnBox}

    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <button class="dos-btn" id="back-btn">&#9668; [ESC] ZURUECK ZUM MENU</button>
      <span class="dim" style="font-size:11px">C:\\AI-FINDER\\&gt; QUERY ABGESCHLOSSEN.</span>
    </div>
  </div>`;
}

// ── STATE MACHINE ─────────────────────────────────────────────────────────
let state = 'boot'; // boot | menu | result
let selectedId = null;

function setState(newState, id) {
  state = newState;
  selectedId = id || null;
  renderApp();
}

function renderApp() {
  const app = document.getElementById('app');
  if (state === 'boot')   { app.innerHTML = renderBoot();   startBoot(); return; }
  if (state === 'menu')   { app.innerHTML = renderMenu();   bindMenu();  return; }
  if (state === 'result') { app.innerHTML = renderResult(selectedId); bindResult(); }
}

function bindMenu() {
  document.querySelectorAll('.menu-item').forEach(el => {
    el.addEventListener('click',    () => setState('result', +el.dataset.id));
    el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') setState('result', +el.dataset.id); });
  });
}

function bindResult() {
  const btn = document.getElementById('back-btn');
  if (btn) btn.addEventListener('click', () => setState('menu'));
  document.addEventListener('keydown', escHandler);
}

function escHandler(e) {
  if (e.key === 'Escape') { document.removeEventListener('keydown', escHandler); setState('menu'); }
}

// ── BOOT ANIMATION ────────────────────────────────────────────────────────
function startBoot() {
  const text = 'AI-FINDER v3.0 LOADING MODULES...';
  const el = document.getElementById('boot-typed');
  let i = 0;
  const t = setInterval(() => {
    i++;
    el.textContent = text.slice(0, i);
    if (i >= text.length) {
      clearInterval(t);
      setTimeout(() => setState('menu'), 450);
    }
  }, 38);
}

// ── INIT ──────────────────────────────────────────────────────────────────
document.getElementById('vbar-date').textContent =
  'DATE: ' + new Date().toLocaleDateString('de-DE') + '  TIME: ' + new Date().toLocaleTimeString('de-DE');

renderApp();
</script>
